# MoneyPrinterTurbo — nginx 反代(放喺宿主機,唔係容器入面)
#   sudo cp nginx/moneyprinterturbo.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/moneyprinterturbo.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 密碼保護唔係可選項。MoneyPrinterTurbo 個 WebUI 完全冇登入機制,
#    冇 basic auth 就等於將你張 LLM / Pexels API key 開放俾全世界用。
#
# ⚠️ 部 VPS 冇 IPv6 嘅話,nginx -t 會報
#    socket() [::]:80 failed (97: Address family not supported by protocol)
#    ——刪走兩行 `listen [::]:...` 即可,其餘唔使郁。

upstream mpt_webui { server 127.0.0.1:8501; }
upstream mpt_api   { server 127.0.0.1:8080; }

# HTTP → HTTPS(certbot 通常會自己加,重覆咗就刪呢段)
server {
    listen 80;
    listen [::]:80;
    server_name mpt.example.com;          # ← 改做你嘅域名

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # 呢個寫法 nginx 1.24(Ubuntu 24.04 出廠版)同 1.25+ 都食得。
    # nginx ≥1.25 會出 deprecation warning,想乾淨嘅話改成:
    #   listen 443 ssl;  listen [::]:443 ssl;  http2 on;
    # ⚠️ 但 http2 on; 喺 1.24 係 unknown directive,會直接起唔到。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mpt.example.com;          # ← 改做你嘅域名

    ssl_certificate     /etc/letsencrypt/live/mpt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mpt.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 上載素材 / 字體;預設 1m 會令上載直接失敗
    client_max_body_size 512m;

    access_log /var/log/nginx/mpt.access.log;
    error_log  /var/log/nginx/mpt.error.log;

    location / {
        auth_basic           "MoneyPrinterTurbo";
        auth_basic_user_file /etc/nginx/.htpasswd-mpt;

        proxy_pass http://mpt_webui;
        proxy_http_version 1.1;

        # Streamlit 靠 WebSocket(/_stcore/stream)推 UI;
        # 冇呢兩行個頁會不停「Connecting…」然後散線,係最典型嘅伏。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 出一條片可以行幾分鐘到成粒鐘,期間條連線係靜嘅。
        # 用預設 60s 你會見到片出到一半就 504。
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # 健康檢查唔使密碼(俾 uptime 監控 ping)
    location /_stcore/health {
        auth_basic off;
        proxy_pass http://mpt_webui;
        access_log off;
    }

    # ── FastAPI(想對外開先解開呢段)────────────────────────
    # 注意:呢個 API 本身冇 auth,開之前諗清楚。
    # location /api/ {
    #     auth_basic           "MoneyPrinterTurbo API";
    #     auth_basic_user_file /etc/nginx/.htpasswd-mpt;
    #     proxy_pass http://mpt_api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 3600s;
    # }
}
